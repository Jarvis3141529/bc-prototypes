<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bognor's Curse — Artifact Mastery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Cinzel', serif;
  background: #1a1008;
  background-image:
    radial-gradient(ellipse at 50% 30%, rgba(120, 80, 20, 0.15) 0%, transparent 60%);
  min-height: 100vh;
  color: #e0d0b0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Tab bar */
.tabs {
  display: flex;
  gap: 0.5rem;
  padding: 1rem;
  flex-wrap: wrap;
  justify-content: center;
  z-index: 10;
}

.tabs button {
  font-family: 'Cinzel', serif;
  font-size: 0.8rem;
  padding: 0.5rem 1.2rem;
  border: 1px solid rgba(200, 160, 80, 0.4);
  background: rgba(40, 30, 15, 0.8);
  color: #c0a060;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.05em;
}

.tabs button.active {
  background: rgba(200, 160, 80, 0.2);
  border-color: #d4a843;
  color: #ffd866;
  box-shadow: 0 0 12px rgba(200, 160, 80, 0.3);
}

.tabs button:hover:not(.active) {
  background: rgba(200, 160, 80, 0.1);
}

/* State label */
.state-label {
  text-align: center;
  font-size: 0.85rem;
  color: #a08050;
  letter-spacing: 0.1em;
  margin-top: 0.5rem;
  min-height: 1.5em;
  transition: color 0.5s;
}
.state-label.active-label {
  color: #ffd866;
  text-shadow: 0 0 10px rgba(255, 200, 80, 0.4);
}

/* Artifact container */
.artifact-wrap {
  position: relative;
  width: min(90vw, 600px);
  margin: 0.5rem auto 2rem;
}

.artifact-frame {
  width: 100%;
  display: block;
  filter: drop-shadow(0 0 20px rgba(180, 140, 60, 0.3));
  transition: filter 1s;
}

.artifact-wrap.fully-restored .artifact-frame {
  filter: drop-shadow(0 0 40px rgba(255, 200, 80, 0.6)) drop-shadow(0 0 80px rgba(255, 180, 60, 0.3));
}

.inner-area {
  position: absolute;
  top: 19%;
  left: 24%;
  width: 52%;
  height: 52%;
  z-index: 2;
}

.socket-array-img { display: none; }

.gem-grid {
  position: absolute;
  top: 3%;
  left: 3%;
  width: 94%;
  height: 94%;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(10, 1fr);
  z-index: 1;
}

.gem-cell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: url('artifact-socket-single.png') center/contain no-repeat;
}

/* Socket (gem element) */
.socket {
  width: 58%;
  aspect-ratio: 1;
  border-radius: 50%;
  position: relative;
  transition: all 0.8s ease;
  background: transparent;
  box-shadow: none;
}

/* Keystone cells — diamond shape */
.gem-cell.keystone-cell .socket {
  border-radius: 3px;
  transform: rotate(45deg);
  width: 60%;
}

/* ======================== */
/* GEM VISUAL STATES (CSS)  */
/* ======================== */

/* Obsidian — dark inert gem */
.socket.obsidian {
  background: radial-gradient(circle at 35% 30%, #3a3a3a, #1a1a1a 60%, #000 120%);
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.05);
}

/* Obsidian lightening levels */
.socket.obsidian-1 {
  background: radial-gradient(circle at 35% 30%, #454545, #2a2a2a 60%, #111 120%);
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.06);
}
.socket.obsidian-2 {
  background: radial-gradient(circle at 35% 30%, #5a5a5a, #4a4a4a 60%, #222 120%);
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.08);
}
.socket.obsidian-3 {
  background: radial-gradient(circle at 35% 30%, #7a7a7a, #6a6a6a 60%, #333 120%);
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.1);
}
.socket.obsidian-4 {
  background: radial-gradient(circle at 35% 30%, #9a9a9a, #8a8a8a 60%, #555 120%);
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.12);
  animation: pulse-light 2.5s ease-in-out infinite;
}

/* Diamond — mastered, brilliant white/ice-blue */
.socket.diamond {
  background: radial-gradient(circle at 35% 30%, #ffffff, #e0e8ff 40%, #b0c0e0 70%, #8090b0 120%);
  box-shadow: 0 0 8px rgba(200, 220, 255, 0.6), 0 0 20px rgba(180, 200, 255, 0.3);
}

/* Diamond sparkle animation */
.socket.diamond.sparkle {
  animation: sparkle 2s ease-in-out infinite;
}

/* Coloured keystones */
.socket.keystone-ruby {
  background: radial-gradient(circle at 35% 30%, #ff6080, #e02040 40%, #a01030 70%, #600820 120%);
  box-shadow: 0 0 12px rgba(224, 32, 64, 0.7), 0 0 30px rgba(255, 48, 80, 0.4), 0 0 50px rgba(224, 32, 64, 0.2);
}
.socket.keystone-sapphire {
  background: radial-gradient(circle at 35% 30%, #80b0ff, #2050d0 40%, #1030a0 70%, #081860 120%);
  box-shadow: 0 0 12px rgba(32, 80, 208, 0.7), 0 0 30px rgba(64, 128, 255, 0.4), 0 0 50px rgba(32, 80, 208, 0.2);
}
.socket.keystone-emerald {
  background: radial-gradient(circle at 35% 30%, #60ff90, #10a040 40%, #087030 70%, #043018 120%);
  box-shadow: 0 0 12px rgba(16, 160, 64, 0.7), 0 0 30px rgba(32, 208, 96, 0.4), 0 0 50px rgba(16, 160, 64, 0.2);
}
.socket.keystone-amethyst {
  background: radial-gradient(circle at 35% 30%, #d0a0ff, #8030c0 40%, #5020a0 70%, #281060 120%);
  box-shadow: 0 0 12px rgba(128, 48, 192, 0.7), 0 0 30px rgba(176, 96, 255, 0.4), 0 0 50px rgba(128, 48, 192, 0.2);
}
.socket.keystone-topaz {
  background: radial-gradient(circle at 35% 30%, #ffe080, #d0a020 40%, #a07810 70%, #604008 120%);
  box-shadow: 0 0 12px rgba(208, 160, 32, 0.7), 0 0 30px rgba(255, 200, 48, 0.4), 0 0 50px rgba(208, 160, 32, 0.2);
}
.socket.keystone-aquamarine {
  background: radial-gradient(circle at 35% 30%, #80f0ff, #10a0b0 40%, #087080 70%, #043040 120%);
  box-shadow: 0 0 12px rgba(16, 160, 176, 0.7), 0 0 30px rgba(48, 208, 224, 0.4), 0 0 50px rgba(16, 160, 176, 0.2);
}
.socket.keystone-rose {
  background: radial-gradient(circle at 35% 30%, #ffa0c0, #d04080 40%, #a02060 70%, #601030 120%);
  box-shadow: 0 0 12px rgba(208, 64, 128, 0.7), 0 0 30px rgba(255, 96, 160, 0.4), 0 0 50px rgba(208, 64, 128, 0.2);
}
.socket.keystone-amber {
  background: radial-gradient(circle at 35% 30%, #ffc080, #e08020 40%, #b06010 70%, #603008 120%);
  box-shadow: 0 0 12px rgba(224, 128, 32, 0.7), 0 0 30px rgba(255, 144, 48, 0.4), 0 0 50px rgba(224, 128, 32, 0.2);
}
.socket.keystone-jade {
  background: radial-gradient(circle at 35% 30%, #80e0a0, #20a060 40%, #107040 70%, #083020 120%);
  box-shadow: 0 0 12px rgba(32, 160, 96, 0.7), 0 0 30px rgba(48, 224, 128, 0.4), 0 0 50px rgba(32, 160, 96, 0.2);
}
.socket.keystone-fire {
  background: radial-gradient(circle at 35% 30%, #ffb060, #e06010 40%, #c04008 70%, #802004 120%);
  box-shadow: 0 0 12px rgba(224, 96, 16, 0.7), 0 0 30px rgba(255, 128, 32, 0.4), 0 0 50px rgba(224, 96, 16, 0.2);
}

/* Blazing keystone animation */
.socket.keystone-blazing {
  animation: blaze-keystone 1.5s ease-in-out infinite;
}

/* Energy lines for row and column */
.energy-line {
  position: absolute;
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
  z-index: 2;
}
.energy-line.row-line {
  left: 0; width: 100%;
  height: 8%;
  background: linear-gradient(90deg, transparent, rgba(64, 128, 255, 0.5), transparent);
  filter: blur(4px);
}
.energy-line.col-line {
  top: 0; height: 100%;
  width: 8%;
  background: linear-gradient(180deg, transparent, rgba(64, 128, 255, 0.5), transparent);
  filter: blur(4px);
}
.energy-line.active {
  opacity: 0.5;
  animation: energyFlow 2s ease-in-out infinite;
}

/* Shimmer overlay */
.shimmer-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, transparent 30%, rgba(255,220,100,0.08) 45%, rgba(255,255,255,0.12) 50%, rgba(255,220,100,0.08) 55%, transparent 70%);
  background-size: 300% 300%;
  z-index: 4;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s;
}
.artifact-wrap.fully-restored .shimmer-overlay {
  opacity: 1;
  animation: shimmer 3s ease-in-out infinite;
}

/* Animations */
@keyframes pulse-light {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}
@keyframes sparkle {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.15); box-shadow: 0 0 12px rgba(200, 220, 255, 0.8), 0 0 25px rgba(180, 200, 255, 0.5); }
}
@keyframes blaze-keystone {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.3); }
}
@keyframes energyFlow {
  0%, 100% { opacity: 0.35; transform: scaleX(0.95); }
  50% { opacity: 0.6; transform: scaleX(1.05); }
}
@keyframes shimmer {
  0% { background-position: 200% 200%; }
  100% { background-position: -100% -100%; }
}

/* Back link */
.back {
  position: fixed;
  top: 0.75rem; left: 0.75rem;
  color: #806040;
  text-decoration: none;
  font-size: 0.8rem;
  z-index: 20;
  opacity: 0.7;
}
.back:hover { opacity: 1; }

@media (max-width: 500px) {
  .tabs button { font-size: 0.65rem; padding: 0.4rem 0.8rem; }
  .artifact-wrap { width: 95vw; }
}
</style>
</head>
<body>

<a class="back" href="../">← Prototypes</a>

<div class="tabs">
  <button class="active" data-state="dormant">🌑 Dormant</button>
  <button data-state="awakening">✨ Awakening</button>
  <button data-state="keystone">🔑 Keystone Ceremony</button>
  <button data-state="restored">🌟 Fully Restored</button>
</div>

<div class="state-label" id="stateLabel">The artifact lies cold and silent…</div>

<div class="artifact-wrap" id="artifactWrap">
  <img class="artifact-frame" src="artifact-frame.png" alt="Artifact Frame">
  <div class="shimmer-overlay"></div>

  <div class="inner-area">
    <img class="socket-array-img" src="artifact-socket-array.png" alt="">
    <div class="gem-grid" id="gemGrid"></div>
  </div>
</div>

<script>
// Keystone colours: ×1 through ×10
const KEYSTONE_COLOURS = [
  'keystone-ruby',       // ×1
  'keystone-sapphire',   // ×2
  'keystone-emerald',    // ×3
  'keystone-amethyst',   // ×4
  'keystone-topaz',      // ×5
  'keystone-aquamarine', // ×6
  'keystone-rose',       // ×7
  'keystone-amber',      // ×8
  'keystone-jade',       // ×9
  'keystone-fire'        // ×10
];

const LABELS = {
  dormant:   'The artifact lies cold and silent…',
  awakening: 'Knowledge stirs within the stones…',
  keystone:  'The ×2 Keystone blazes with mastery!',
  restored:  '✦ The Artifact blazes with full power! ✦'
};

// Deterministic "awakening" lightness levels (0-4) for non-keystone cells
// About 40% of gems get some lightening
const AWAKENING_LEVELS = [];
for (let r = 0; r < 10; r++) {
  AWAKENING_LEVELS[r] = [];
  for (let c = 0; c < 10; c++) {
    const hash = Math.sin(r * 13.7 + c * 7.3 + 42);
    if (hash > 0.2) {
      // Assign levels 1-4 based on hash
      AWAKENING_LEVELS[r][c] = Math.min(4, Math.floor((hash - 0.2) * 6) + 1);
    } else {
      AWAKENING_LEVELS[r][c] = 0; // stays dark obsidian
    }
  }
}
// ×2 row (grid row 8) is more progressed
for (let c = 0; c < 10; c++) {
  AWAKENING_LEVELS[8][c] = Math.max(AWAKENING_LEVELS[8][c], 3);
}

const ALL_GEM_CLASSES = [
  'obsidian', 'obsidian-1', 'obsidian-2', 'obsidian-3', 'obsidian-4',
  'diamond', 'sparkle',
  ...KEYSTONE_COLOURS, 'keystone-blazing'
];

// Build grid
// Grid row 0 = top = ×10, row 9 = bottom = ×1
// Keystone for multiplier N at row=(10-N), col=(N-1)
const gridEl = document.getElementById('gemGrid');

for (let r = 0; r < 10; r++) {
  const mult = 10 - r;
  for (let c = 0; c < 10; c++) {
    const factor = c + 1;
    const isKeystone = (factor === mult);

    const cell = document.createElement('div');
    cell.className = 'gem-cell';
    cell.style.gridRow = r + 1;
    cell.style.gridColumn = c + 1;
    if (isKeystone) cell.classList.add('keystone-cell');

    const socket = document.createElement('div');
    socket.className = 'socket';
    socket.dataset.mult = mult;
    socket.dataset.factor = factor;
    socket.dataset.row = r;
    socket.dataset.col = c;
    socket.dataset.isKeystone = isKeystone ? '1' : '0';

    cell.appendChild(socket);
    gridEl.appendChild(cell);
  }
}

// Energy lines (row and column for keystone ceremony)
const rowEnergy = document.createElement('div');
rowEnergy.className = 'energy-line row-line';
rowEnergy.id = 'energyRow';
gridEl.appendChild(rowEnergy);

const colEnergy = document.createElement('div');
colEnergy.className = 'energy-line col-line';
colEnergy.id = 'energyCol';
gridEl.appendChild(colEnergy);

function clearSockets() {
  gridEl.querySelectorAll('.socket').forEach(s => {
    ALL_GEM_CLASSES.forEach(cls => s.classList.remove(cls));
  });
  rowEnergy.classList.remove('active');
  colEnergy.classList.remove('active');
}

function applyState(state) {
  const sockets = gridEl.querySelectorAll('.socket');
  const wrap = document.getElementById('artifactWrap');
  const label = document.getElementById('stateLabel');

  wrap.classList.remove('fully-restored');
  label.classList.remove('active-label');
  label.textContent = LABELS[state];
  clearSockets();

  if (state === 'dormant') {
    sockets.forEach(s => {
      if (s.dataset.isKeystone === '1') return; // empty socket
      s.classList.add('obsidian');
    });
    return;
  }

  if (state === 'awakening') {
    sockets.forEach(s => {
      if (s.dataset.isKeystone === '1') return; // keystones empty
      const r = +s.dataset.row, c = +s.dataset.col;
      const level = AWAKENING_LEVELS[r][c];
      if (level === 0) {
        s.classList.add('obsidian');
      } else {
        s.classList.add('obsidian-' + level);
      }
    });
    return;
  }

  if (state === 'keystone') {
    label.classList.add('active-label');
    // ×2 keystone at row 8, col 1 (mult=2, factor=2)
    const keystoneRow = 8;
    const keystoneCol = 1;

    sockets.forEach(s => {
      const r = +s.dataset.row, c = +s.dataset.col;
      const isK = s.dataset.isKeystone === '1';

      // The ×2 keystone itself
      if (r === keystoneRow && c === keystoneCol) {
        s.classList.add('keystone-sapphire', 'keystone-blazing');
        return;
      }

      // All gems in ×2's row or column become diamond
      if (r === keystoneRow || c === keystoneCol) {
        if (isK) return; // other keystones stay empty
        s.classList.add('diamond');
        return;
      }

      // Rest: obsidian at various levels
      if (isK) return; // other keystones empty
      const level = AWAKENING_LEVELS[r][c];
      if (level === 0) {
        s.classList.add('obsidian');
      } else {
        s.classList.add('obsidian-' + Math.min(level, 2)); // less progressed than awakening
      }
    });

    // Position energy lines on row 8 and col 1
    rowEnergy.style.top = `${(keystoneRow / 10) * 100 + 5}%`;
    colEnergy.style.left = `${(keystoneCol / 10) * 100 + 5}%`;
    rowEnergy.classList.add('active');
    colEnergy.classList.add('active');
    return;
  }

  if (state === 'restored') {
    wrap.classList.add('fully-restored');
    label.classList.add('active-label');

    sockets.forEach(s => {
      if (s.dataset.isKeystone === '1') {
        const mult = +s.dataset.mult;
        s.classList.add(KEYSTONE_COLOURS[mult - 1], 'keystone-blazing');
      } else {
        s.classList.add('diamond', 'sparkle');
      }
    });
  }
}

// Tab switching
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyState(btn.dataset.state);
  });
});

applyState('dormant');
</script>
</body>
</html>
