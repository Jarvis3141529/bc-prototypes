<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bognor's Curse — Artifact Mastery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Cinzel', serif;
  background: #1a1008;
  background-image:
    radial-gradient(ellipse at 50% 30%, rgba(120, 80, 20, 0.15) 0%, transparent 60%);
  min-height: 100vh;
  color: #e0d0b0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Tab bar */
.tabs {
  display: flex;
  gap: 0.5rem;
  padding: 1rem;
  flex-wrap: wrap;
  justify-content: center;
  z-index: 10;
}

.tabs button {
  font-family: 'Cinzel', serif;
  font-size: 0.8rem;
  padding: 0.5rem 1.2rem;
  border: 1px solid rgba(200, 160, 80, 0.4);
  background: rgba(40, 30, 15, 0.8);
  color: #c0a060;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.05em;
}

.tabs button.active {
  background: rgba(200, 160, 80, 0.2);
  border-color: #d4a843;
  color: #ffd866;
  box-shadow: 0 0 12px rgba(200, 160, 80, 0.3);
}

.tabs button:hover:not(.active) {
  background: rgba(200, 160, 80, 0.1);
}

/* State label */
.state-label {
  text-align: center;
  font-size: 0.85rem;
  color: #a08050;
  letter-spacing: 0.1em;
  margin-top: 0.5rem;
  min-height: 1.5em;
  transition: color 0.5s;
}
.state-label.active-label {
  color: #ffd866;
  text-shadow: 0 0 10px rgba(255, 200, 80, 0.4);
}

/* Artifact container — frame is the sizing reference */
.artifact-wrap {
  position: relative;
  width: min(90vw, 600px);
  margin: 0.5rem auto 2rem;
}

.artifact-frame {
  width: 100%;
  display: block;
  filter: drop-shadow(0 0 20px rgba(180, 140, 60, 0.3));
  transition: filter 1s;
}

.artifact-wrap.fully-restored .artifact-frame {
  filter: drop-shadow(0 0 40px rgba(255, 200, 80, 0.6)) drop-shadow(0 0 80px rgba(255, 180, 60, 0.3));
}

/* Inner area — positioned as percentage of frame image
   Frame inner golden area: top ~18%, left ~15%, width ~70%, height ~56% */
.inner-area {
  position: absolute;
  top: 18%;
  left: 15%;
  width: 70%;
  height: 56%;
  z-index: 2;
}

/* Socket array background fills the inner area */
.socket-array-img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: fill;
  pointer-events: none;
  z-index: 0;
}

/* Gem grid — 10 columns × 10 rows, overlaid on the socket array.
   Column 0 = keystone column, columns 1-9 = regular gems.
   We use a CSS grid matching the socket positions. */
.gem-grid {
  position: absolute;
  /* The socket array image has some padding; nudge grid to align with sockets */
  top: 2%;
  left: 1%;
  width: 98%;
  height: 96%;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(10, 1fr);
  z-index: 1;
}

/* Each gem cell */
.gem-cell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Socket (the interactive gem element inside each cell) */
.socket {
  width: 75%;
  aspect-ratio: 1;
  border-radius: 50%;
  position: relative;
  transition: all 0.8s ease;
  /* Default: invisible (socket array image shows the empty socket) */
  background: transparent;
}

/* Keystone cells — diamond shape in column 0 */
.gem-cell.keystone-cell .socket {
  border-radius: 3px;
  transform: rotate(45deg);
  width: 60%;
}

/* Gem sprite — shown when lit */
.socket .gem-sprite {
  position: absolute;
  top: 5%; left: 5%;
  width: 90%; height: 90%;
  border-radius: 50%;
  background-image: url('artifact-gemstones.jpg');
  /* Sprite: 1536×1024, 6 cols × 2 rows => each gem 256×512 */
  background-size: 600% 200%;
  mix-blend-mode: multiply;
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
}

.gem-cell.keystone-cell .socket .gem-sprite {
  border-radius: 3px;
}

/* Gem color classes — set sprite background-position
   Row 1 (top): ruby, fire-orange, golden-yellow, emerald, yellow-topaz, aqua
   Row 2 (bot): sapphire, amethyst, pink, grey, silver, amber
   Using 10: ruby, fire-orange, golden-yellow, emerald, yellow-topaz, aqua, sapphire, amethyst, pink, amber */
.gem-ruby .gem-sprite    { background-position: 0% 0%; }
.gem-orange .gem-sprite  { background-position: 20% 0%; }
.gem-gold .gem-sprite    { background-position: 40% 0%; }
.gem-emerald .gem-sprite { background-position: 60% 0%; }
.gem-topaz .gem-sprite   { background-position: 80% 0%; }
.gem-aqua .gem-sprite    { background-position: 100% 0%; }
.gem-sapphire .gem-sprite{ background-position: 0% 100%; }
.gem-amethyst .gem-sprite{ background-position: 20% 100%; }
.gem-pink .gem-sprite    { background-position: 40% 100%; }
.gem-amber .gem-sprite   { background-position: 100% 100%; }

/* Glow colors per gem */
.gem-ruby    { --gem: #e02040; --glow: #ff3050; --shine: #ff8090; }
.gem-orange  { --gem: #e07020; --glow: #ff9030; --shine: #ffc080; }
.gem-gold    { --gem: #d0a020; --glow: #ffc830; --shine: #ffe080; }
.gem-emerald { --gem: #10a040; --glow: #20d060; --shine: #80ff90; }
.gem-topaz   { --gem: #c0a010; --glow: #e0c030; --shine: #f0e080; }
.gem-aqua    { --gem: #10a0b0; --glow: #30d0e0; --shine: #80f0ff; }
.gem-sapphire{ --gem: #2050d0; --glow: #4080ff; --shine: #90b0ff; }
.gem-amethyst{ --gem: #8030c0; --glow: #b060ff; --shine: #d0a0ff; }
.gem-pink    { --gem: #d04080; --glow: #ff60a0; --shine: #ffa0c0; }
.gem-amber   { --gem: #d07020; --glow: #ff9030; --shine: #ffc080; }

/* Lit states */
.socket.lit .gem-sprite {
  opacity: 1;
}

.socket.lit {
  box-shadow: 0 0 6px var(--glow), 0 0 2px var(--gem);
  background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.1), transparent 70%);
}

.socket.lit.faint {
  opacity: 0.55;
  animation: pulse 2.5s ease-in-out infinite;
}
.socket.lit.faint .gem-sprite { opacity: 0.7; }

.socket.lit.bright {
  box-shadow: 0 0 10px var(--glow), 0 0 20px rgba(255,200,80,0.2), 0 0 3px var(--gem);
}

.socket.lit.blazing {
  box-shadow: 0 0 14px var(--glow), 0 0 30px var(--glow), 0 0 5px var(--gem);
  animation: blaze 1.5s ease-in-out infinite;
}

/* Row energy lines */
.row-energy {
  position: absolute;
  left: 0; width: 100%;
  height: 8%;
  background: linear-gradient(90deg, transparent, var(--glow), transparent);
  opacity: 0;
  transition: opacity 0.8s;
  pointer-events: none;
  filter: blur(4px);
  border-radius: 50%;
  z-index: 2;
}
.row-energy.active {
  opacity: 0.35;
  animation: energyFlow 2s ease-in-out infinite;
}

/* Shimmer overlay */
.shimmer-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, transparent 30%, rgba(255,220,100,0.08) 45%, rgba(255,255,255,0.12) 50%, rgba(255,220,100,0.08) 55%, transparent 70%);
  background-size: 300% 300%;
  z-index: 4;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s;
}
.artifact-wrap.fully-restored .shimmer-overlay {
  opacity: 1;
  animation: shimmer 3s ease-in-out infinite;
}

/* Animations */
@keyframes pulse {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 0.75; }
}
@keyframes blaze {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.3); }
}
@keyframes energyFlow {
  0%, 100% { opacity: 0.25; transform: scaleX(0.95); }
  50% { opacity: 0.5; transform: scaleX(1.05); }
}
@keyframes shimmer {
  0% { background-position: 200% 200%; }
  100% { background-position: -100% -100%; }
}

/* Back link */
.back {
  position: fixed;
  top: 0.75rem; left: 0.75rem;
  color: #806040;
  text-decoration: none;
  font-size: 0.8rem;
  z-index: 20;
  opacity: 0.7;
}
.back:hover { opacity: 1; }

/* Responsive */
@media (max-width: 500px) {
  .tabs button { font-size: 0.65rem; padding: 0.4rem 0.8rem; }
  .artifact-wrap { width: 95vw; }
}
</style>
</head>
<body>

<a class="back" href="../">← Prototypes</a>

<div class="tabs">
  <button class="active" data-state="dormant">🌑 Dormant</button>
  <button data-state="learning">✨ Learning</button>
  <button data-state="keystone">🔑 Keystone</button>
  <button data-state="restored">🌟 Fully Restored</button>
</div>

<div class="state-label" id="stateLabel">The artifact lies cold and silent…</div>

<div class="artifact-wrap" id="artifactWrap">
  <!-- Frame image sets the natural size -->
  <img class="artifact-frame" src="artifact-frame.png" alt="Artifact Frame">
  <div class="shimmer-overlay"></div>

  <!-- Inner area: positioned over the golden interior of the frame -->
  <div class="inner-area">
    <img class="socket-array-img" src="artifact-socket-array.png" alt="">
    <div class="gem-grid" id="gemGrid"></div>
  </div>
</div>

<script>
// 10 gem types for ×1 through ×10
const GEM_CLASSES = [
  'gem-ruby','gem-orange','gem-gold','gem-emerald','gem-topaz',
  'gem-aqua','gem-sapphire','gem-amethyst','gem-pink','gem-amber'
];

const LABELS = {
  dormant: 'The artifact lies cold and silent…',
  learning: 'Faint glimmers of knowledge awaken…',
  keystone: 'The ×2 Keystone pulses with mastery!',
  restored: '✦ The Artifact blazes with full power! ✦'
};

// Deterministic learning pattern
const LEARNING_MASK = [];
for (let r = 0; r < 10; r++) {
  LEARNING_MASK[r] = [];
  for (let c = 0; c < 10; c++) {
    LEARNING_MASK[r][c] = Math.sin(r * 13.7 + c * 7.3 + 42) > 0.3;
  }
}
for (let c = 0; c < 10; c++) LEARNING_MASK[1][c] = true;

// Build 10×10 grid. Column 0 = keystones, columns 1-9 = regular gems
const gridEl = document.getElementById('gemGrid');

for (let r = 0; r < 10; r++) {
  // Row energy line
  const energy = document.createElement('div');
  energy.className = `row-energy ${GEM_CLASSES[r]}`;
  energy.dataset.row = r;
  energy.style.top = `${(r / 10) * 100 + 3}%`;
  gridEl.appendChild(energy);

  for (let c = 0; c < 10; c++) {
    const cell = document.createElement('div');
    cell.className = `gem-cell ${GEM_CLASSES[r]}`;
    cell.style.gridRow = r + 1;
    cell.style.gridColumn = c + 1;

    if (c === 0) {
      cell.classList.add('keystone-cell');
    }

    const socket = document.createElement('div');
    socket.className = 'socket';
    socket.dataset.row = r;
    socket.dataset.col = c;

    const sprite = document.createElement('div');
    sprite.className = 'gem-sprite';
    socket.appendChild(sprite);

    cell.appendChild(socket);
    gridEl.appendChild(cell);
  }
}

function applyState(state) {
  const sockets = gridEl.querySelectorAll('.socket');
  const energyLines = gridEl.querySelectorAll('.row-energy');
  const wrap = document.getElementById('artifactWrap');
  const label = document.getElementById('stateLabel');

  wrap.classList.remove('fully-restored');
  label.classList.remove('active-label');
  label.textContent = LABELS[state];

  sockets.forEach(s => {
    s.classList.remove('lit', 'faint', 'bright', 'blazing');
  });
  energyLines.forEach(e => e.classList.remove('active'));

  if (state === 'dormant') return;

  if (state === 'learning') {
    sockets.forEach(s => {
      const r = +s.dataset.row, c = +s.dataset.col;
      if (LEARNING_MASK[r][c]) {
        s.classList.add('lit', 'faint');
      }
    });
  }

  if (state === 'keystone') {
    sockets.forEach(s => {
      const r = +s.dataset.row, c = +s.dataset.col;
      if (r === 1) {
        s.classList.add('lit', 'bright');
      } else if (LEARNING_MASK[r][c]) {
        s.classList.add('lit', 'faint');
      }
    });
    energyLines.forEach(e => {
      if (+e.dataset.row === 1) e.classList.add('active');
    });
    label.classList.add('active-label');
  }

  if (state === 'restored') {
    wrap.classList.add('fully-restored');
    label.classList.add('active-label');
    sockets.forEach(s => s.classList.add('lit', 'blazing'));
    energyLines.forEach(e => e.classList.add('active'));
  }
}

// Tab switching
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyState(btn.dataset.state);
  });
});

applyState('dormant');
</script>
</body>
</html>
